[theme]
# 버튼·강조는 잉크(검정). 빨강은 '비쌈' 신호 전용, 파랑은 '저렴' 신호 전용이라 버튼에 쓰지 않음
base = "light"
primaryColor = "#222222"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#ffffff"
textColor = "#222222"
borderColor = "#dddddd"
showWidgetBorder = true
baseRadius = "8px"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
